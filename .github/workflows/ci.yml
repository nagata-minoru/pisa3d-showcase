name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR で新しい実行が始まったら古い実行は取り消す（main は公開途中で止めないよう取り消さない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      # Yarn 本体は .yarn/releases/ に同梱しているため、corepack は不要
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn type-check
      - run: yarn test
      - run: yarn build
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # main への push（と手動実行）のときだけ、チェックが通ったビルド結果を GitHub Pages に公開する
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

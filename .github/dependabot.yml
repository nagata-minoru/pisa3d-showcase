# 依存パッケージの更新PRを週1回作る
# 公開から14日たっていない版は使わない（cooldown）。PRはエコシステムごとに1つにまとめる
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns: ['*']
    # package.json の typescript は typescript-eslint と vue-tsc 向けの TypeScript 6 API（@typescript/typescript6 の別名）なので、7 以上にしない
    ignore:
      - dependency-name: typescript
        versions: ['>= 7']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
